<title>Toravo Tandem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: two handheld screens stacked like the Thor (top 16:9, bottom 1240:1080 at 62 % width); everything inside a
   screen is sized in cqw so the same markup fills a real display in #top / #bottom mode. Single dark look on purpose:
   it is an OLED handheld UI. */
:root{color-scheme:dark;--ink:#0a0c13;--panel:#141824;--raised:#1e2434;--line:#2c3449;--text:#eef0f6;--muted:#8d94aa;
 --focus:#ffb23e;--live:#39d0b8;--warn:#ff7a66;--display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow",system-ui,sans-serif}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);padding-block:18px;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.head h1{font:700 26px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.head p{margin:0;color:var(--muted);font-size:14px;min-width:0}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px}
.screen{container-type:inline-size;position:relative;overflow:hidden;background:#000;border:1px solid var(--line);border-radius:10px;max-width:100%}
.top{width:100%;aspect-ratio:16/9}
.bot{width:62%;aspect-ratio:1240/1080}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px}
.keys b{color:var(--text);font-weight:600;border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-right:4px;background:var(--panel)}
.note{color:var(--muted);font-size:13px;line-height:1.5;max-width:70ch}
body.solo{padding:0}body.solo .wrap{max-width:none;height:100%}
body.solo .head,body.solo .keys,body.solo .note{display:none}
body.solo .stage{height:100%}body.solo .screen{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0}
body.only-top .bot,body.only-bottom .top{display:none}

/* top screen */
.hero{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:4cqw}
.art{position:absolute;inset:0;background-size:cover;background-position:center}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,12,19,.92) 0,rgba(10,12,19,.55) 45%,rgba(10,12,19,0) 80%),linear-gradient(0deg,rgba(10,12,19,.85),rgba(10,12,19,0) 55%)}
.glyph{position:absolute;right:3cqw;top:50%;translate:0 -50%;font:700 30cqw/1 var(--display);color:rgba(255,255,255,.13);letter-spacing:-.02em}
.status{position:absolute;top:2.2cqw;right:3cqw;display:flex;gap:2cqw;font:500 1.7cqw var(--body);color:var(--text);font-variant-numeric:tabular-nums}
.status i{font-style:normal;color:var(--muted)}
.hero>:not(.art,.glyph,.status){position:relative}
.sys{font:700 1.9cqw var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--focus)}
.name{font:700 6.2cqw/1.02 var(--display);text-transform:uppercase;margin:.6cqw 0 1.2cqw;max-width:62cqw;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:1cqw 2.4cqw;font-size:1.8cqw;color:var(--muted)}
.meta span b{color:var(--text);font-weight:500}
.hint{margin-top:2.2cqw;display:flex;gap:2.4cqw;font-size:1.7cqw;color:var(--muted)}
.pad{display:inline-grid;place-items:center;width:2.6cqw;height:2.6cqw;border-radius:50%;background:var(--text);color:var(--ink);font:700 1.5cqw var(--display);margin-right:.7cqw}
.run .sys{color:var(--live)}
.cmd{margin-top:1.6cqw;font:500 1.45cqw ui-monospace,Menlo,monospace;color:var(--live);background:rgba(10,12,19,.7);border:1px solid var(--line);border-radius:.8cqw;padding:.9cqw 1.2cqw;max-width:74cqw;overflow-wrap:anywhere}
.cmd.open{color:var(--warn)}

/* bottom screen */
.shell{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--ink);padding:2.6cqw;gap:2.2cqw}
.tabs{display:flex;gap:1cqw;align-items:center}
.tab{font:700 3cqw var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:none;border:0;padding:.8cqw 1.6cqw;border-radius:1cqw;cursor:pointer}
.tab.on{color:var(--ink);background:var(--text)}
.crumb{margin-left:auto;font-size:2.3cqw;color:var(--muted)}
.grid{flex:1;min-height:0;padding:.8cqw;margin:-.8cqw;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:min-content;gap:1.8cqw;overflow:hidden;align-content:start}
.tile.off img{opacity:.4;filter:saturate(.3)}
.tile{position:relative;aspect-ratio:1;border-radius:1.6cqw;border:.35cqw solid transparent;overflow:hidden;cursor:pointer;padding:0;color:var(--text);text-align:left;font-family:var(--body)}
.tile.on{border-color:var(--focus);box-shadow:0 0 0 .35cqw rgba(255,178,62,.25);scale:1.04;z-index:1}
.tile:focus-visible{outline:.4cqw solid var(--live)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .star{position:absolute;right:1cqw;top:1cqw;font-size:2.4cqw;color:var(--focus);text-shadow:0 0 .6cqw #000}
.empty{grid-column:1/-1;color:var(--muted);font-size:2.4cqw;line-height:1.5;padding:4cqw 1cqw}
.toast{position:absolute;left:50%;bottom:4cqw;translate:-50% 0;max-width:80cqw;background:var(--raised);border:1px solid var(--warn);border-radius:1.2cqw;padding:1.2cqw 2cqw;font-size:1.9cqw;line-height:1.35;z-index:5}
.bot .toast{font-size:2.6cqw}
.demo{color:var(--focus)}
.tile .ini{position:absolute;left:1.2cqw;top:.4cqw;font:700 7cqw/1 var(--display);color:rgba(255,255,255,.28)}
.tile .lab{position:absolute;inset:auto 0 0 0;padding:3cqw 1.1cqw 0;border-bottom:.9cqw solid transparent;font-size:1.75cqw;line-height:1.15;font-weight:500;background:linear-gradient(0deg,rgba(0,0,0,.78),rgba(0,0,0,0));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .cnt{position:absolute;right:1cqw;top:1cqw;font:700 1.9cqw var(--display);background:rgba(0,0,0,.55);border-radius:.8cqw;padding:.1cqw .8cqw;font-variant-numeric:tabular-nums}
.panel{flex:1;display:flex;flex-direction:column;gap:1.8cqw;min-height:0}
.panel h2{font:700 4.4cqw/1 var(--display);text-transform:uppercase;margin:0}
.panel h2 small{display:block;font:500 2.2cqw var(--body);color:var(--live);text-transform:none;margin-top:.8cqw}
.facts{display:grid;grid-template-columns:auto 1fr;gap:1.6cqw 3cqw;font-size:2.6cqw;color:var(--muted)}
.facts b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.tip{font-size:2.2cqw;line-height:1.45;color:var(--muted)}
.row{display:grid;grid-template-columns:25cqw 1fr 9cqw;align-items:center;gap:2cqw;font-size:2.5cqw;color:var(--muted)}
.row output{text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:5cqw;accent-color:var(--focus)}
.tip b{color:var(--text);font-weight:500}
.acct{display:grid;grid-template-columns:25cqw 1fr 1fr;gap:1.4cqw;align-items:center;font-size:2.5cqw;color:var(--muted)}
.acct input{min-width:0;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:1.2cqw;padding:1.4cqw 1.6cqw}
.acct label{grid-row:span 2}.acct button{font:700 2.4cqw var(--display);letter-spacing:.06em;text-transform:uppercase;padding:1.5cqw 2cqw;border-radius:1.2cqw;border:1px solid var(--line);background:var(--raised);color:var(--text)}
.ach{flex:1;min-height:18cqw;overflow-y:auto;display:flex;flex-direction:column;gap:1cqw;font-size:2.1cqw;color:var(--muted)}
.ach div{background:var(--panel);border-radius:1cqw;padding:1cqw 1.4cqw}.ach div b{color:var(--text);font-weight:500}.ach div.got b{color:var(--live)}
.ach i{font-style:normal;float:right;color:var(--focus)}.ach span{display:block}.ach .tip b{color:var(--text)}
.kb{flex:1;display:flex;flex-direction:column;gap:1.1cqw;min-height:0}.kb div{flex:1;display:flex;gap:1cqw}
.kb button{flex:1;min-width:0;font:600 3.4cqw var(--body);color:var(--text);background:var(--raised);border:1px solid var(--line);border-radius:1.2cqw;cursor:pointer;padding:0}
.kb button.wide{flex:5}.kb button.on{background:var(--focus);color:var(--ink);border-color:var(--focus)}.kb button:active{background:var(--line)}
.line{display:grid;grid-template-columns:25cqw 1fr auto auto auto;align-items:center;gap:1.4cqw;font-size:2.5cqw;color:var(--muted)}
.line b{color:var(--text);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line button,.list button{font:700 2.3cqw var(--display);letter-spacing:.06em;text-transform:uppercase;padding:1.4cqw 1.8cqw;border-radius:1.2cqw;border:1px solid var(--line);background:var(--raised);color:var(--text);cursor:pointer}
.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1cqw}
.list button{display:flex;justify-content:space-between;text-transform:none;font:500 2.6cqw var(--body);letter-spacing:0}.list i{font-style:normal;color:var(--muted)}
.field{font:500 4cqw var(--body);background:var(--panel);border:1px solid var(--focus);border-radius:1.4cqw;padding:2cqw;min-height:5cqw;overflow-wrap:anywhere}
.field i{display:inline-block;width:.4cqw;height:4cqw;background:var(--focus);vertical-align:middle;margin-left:.4cqw}
.tile .ico{position:absolute;inset:14% 22% 30% 22%;width:56%;height:56%;color:rgba(255,255,255,.85)}
.held{display:flex;align-items:center;gap:1.4cqw;background:var(--raised);border:1px solid var(--live);border-radius:1.4cqw;padding:1.2cqw 1.6cqw;font-size:2.5cqw;color:var(--muted)}
.held span{flex:1;min-width:0}.held b{color:var(--text);font-weight:500}
.held button{font:700 2.4cqw var(--display);letter-spacing:.06em;text-transform:uppercase;padding:1.3cqw 2cqw;border-radius:1.1cqw;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
.held button:first-of-type{background:var(--live);color:var(--ink);border-color:var(--live)}
.osd{position:absolute;left:50%;bottom:6cqw;translate:-50% 0;display:flex;align-items:center;gap:1.6cqw;width:44cqw;background:rgba(20,24,36,.94);border:1px solid var(--line);border-radius:5cqw;padding:1.4cqw 2.4cqw;z-index:6;color:var(--text)}
.osd svg{width:3.4cqw;height:3.4cqw;flex:none}.osd .bar{flex:1;height:1cqw;background:var(--line);border-radius:1cqw;overflow:hidden}
.osd .bar i{display:block;height:100%;background:var(--focus);border-radius:1cqw}.osd b{font:700 2.4cqw var(--display);min-width:4cqw;text-align:right;font-variant-numeric:tabular-nums}
.bot .osd{width:70cqw;bottom:8cqw}.bot .osd svg{width:5cqw;height:5cqw}.bot .osd b{font-size:3.6cqw;min-width:6cqw}.bot .osd .bar{height:1.6cqw}
.ask{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4cqw;background:rgba(10,12,19,.88);z-index:4;padding:6cqw;text-align:center}
.ask p{font:700 3.6cqw/1.2 var(--display);text-transform:uppercase;margin:0;max-width:70cqw;text-wrap:balance}
.ask div{display:flex;gap:3cqw;font-size:2cqw;color:var(--muted)}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2cqw}
.pads button,.act button{flex:1;font:700 2.6cqw var(--display);letter-spacing:.06em;text-transform:uppercase;padding:1.6cqw 1cqw;border-radius:1.4cqw;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.act{display:flex;gap:1.4cqw;margin-top:auto}
.pads button:active,.act button:active{background:var(--line);color:var(--text)}
.act .quit{background:var(--warn);color:var(--ink);border-color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){.bot{width:86%}.head h1{font-size:22px}}
</style>

function start(it){
 if(it.id=='act:desktop')return confirmDesktop();
 if(RUN&&RUN.paused&&it.kind!='sys'){if(it.id==RUN.id)return resume();if(it.id!='rescan'&&!it.id.startsWith('upd:')&&it.id!='act:steam')return confirmQuit(it)}

 if(it.id=='act:steam'){if(LIVE)post('api/action',{name:'steam'});else toast('In der Vorschau gibt es kein Steam.');return}
 if(it.id=='rescan'){if(LIVE)post('api/rescan').then(r=>toast(r.games+' Spiele gefunden'+(r.covers?', '+r.covers+' Cover geladen.':'.')));else toast('In der Vorschau gibt es nichts einzulesen.');return}
 if(LIVE){post('api/launch',{id:it.id}).catch(()=>toast('Tandem-Dienst antwortet nicht.'));return}
 const sys=L.systems[it.s];
 if(sys&&sys.missing)return toast(sys.missing);
 if(it.s=='steam'||it.s=='app')return toast('Gestartet – zurück geht es über die Steam-Taste.');
 RUN={id:it.id,t:it.t,s:it.s,emu:sys.emu,since:Date.now()/1000};render();
}
function quit(){if(LIVE)post('api/quit').catch(()=>{});else{RUN=null;render()}}
function go(a){
 const list=items(),n=list.length,it=list[S.i];
 if(CONFIRM){const c=CONFIRM;if(a=='ok'){unconfirm();c.run()}else if(a=='back'){unconfirm();render()}return}
 if(playing()){if(a=='back'&&RUN.s!='term')toast('Zum Beenden unten „Spiel beenden“ tippen.');return}
 if(a=='left')S.i=Math.max(0,S.i-1);
 else if(a=='right')S.i=Math.min(n-1,S.i+1);
 else if(a=='up')S.i=S.i>=COLS?S.i-COLS:S.i;
 else if(a=='down')S.i=S.i+COLS<n?S.i+COLS:S.i;
 else if(a=='prev'||a=='next'){S.sys=null;S.tab=(S.tab+(a=='next'?1:TABS.length-1))%TABS.length;S.i=0}
 else if(a=='ok'){if(!it)return;if(it.kind=='sys'){S.sys=it.s;S.i=0}else return start(it)}
 else if(a=='close'){if(RUN&&RUN.paused)confirmQuit(null);return}
 else if(a=='fav'){if(!it||it.kind||it.s=='app')return;
  if(LIVE)post('api/fav',{id:it.id}).catch(()=>{});else{L.fav.includes(it.id)?L.fav.splice(L.fav.indexOf(it.id),1):L.fav.push(it.id);shown=''}}
 else if(a=='back'&&S.sys){S.i=Object.keys(L.systems).indexOf(S.sys);S.sys=null;S.tab=1}
 push();
}

 else if(d.ask){const k=d.ask;ask({ra_user:'Benutzername bei RetroAchievements',ra_password:'Passwort bei RetroAchievements',ra_key:'Web-API-Schlüssel'}[k],k!='ra_user',v=>{if(!v||!LIVE)return;
   post('api/config',{[k]:v}).then(c=>{CFG=c;toast(c.error||(c.applied?'Angemeldet und eingetragen in: '+c.applied.join(', '):'Gespeichert.'))}).catch(()=>toast('Speichern fehlgeschlagen.'))})}
 else if(d.wifi){const go=pw=>{toast('Verbinde mit '+d.wifi+' …');post('api/wifi',{ssid:d.wifi,password:pw||''}).then(r=>{toast(r.error||'Verbunden mit '+d.wifi+'.');SUB='';loadSys()}).catch(()=>toast('Verbinden fehlgeschlagen.'))};
   if(d.secure)ask('Passwort für '+d.wifi,true,pw=>pw&&go(pw));else go('')}
 else if(d.layout&&LIVE)post('api/layout',{layout:d.layout}).catch(()=>{})
 else if(d.confirm){const c=CONFIRM;unconfirm();if(d.confirm=='yes')c.run();render()}
 else if(d.act=='resume')resume()
 else if(d.act=='quit')quit()
 else if(d.ra&&LIVE)post('api/retroarch',{name:d.ra}).catch(()=>{})
 else if(d.action&&LIVE)post('api/action',{name:d.action}).then(r=>r.error&&toast(r.error)).catch(()=>{})});
sb.addEventListener('submit',e=>{e.preventDefault();if(e.target.id!='ra'||!LIVE)return;const f=new FormData(e.target);
 post('api/config',{ra_user:f.get('ra_user'),ra_key:f.get('ra_key'),ra_password:f.get('ra_password')}).then(c=>{CFG=c;document.activeElement&&document.activeElement.blur();
  toast(c.error||(c.applied?'Angemeldet und eingetragen in: '+c.applied.join(', '):'RetroAchievements gespeichert.'))}).catch(()=>toast('Speichern fehlgeschlagen.'))});
let setTimer=null;
sb.addEventListener('input',e=>{const k=e.target.dataset.set;if(!k)return;SET[k]=+e.target.value;e.target.nextElementSibling.value=SET[k]+' %';
 clearTimeout(setTimer);setTimer=setTimeout(()=>LIVE&&post('api/set',{key:k,value:SET[k],from:ME}).catch(()=>{}),60)});
sb.addEventListener('pointerdown',e=>{if(e.target.type=='range')DRAG=true});
addEventListener('pointerup',()=>{DRAG=false});addEventListener('pointercancel',()=>{DRAG=false});
// With the service running it reads the controller and sends 'key' events; the page reads it only in the preview.
// The Thor's buttons are printed Nintendo-style: A is the right button (index 1), B the bottom one (0), X the top one (2), Y the left one (3).
const PAD={12:'up',13:'down',14:'left',15:'right',1:'ok',0:'back',4:'prev',5:'next',3:'fav',2:'close'};let held={},axis='';
(function poll(){if(!LIVE&&location.hash!='#bottom')for(const p of (navigator.getGamepads?navigator.getGamepads():[])){if(!p)continue;
  for(const b in PAD){const d=p.buttons[b]&&p.buttons[b].pressed;if(d&&!held[b])go(PAD[b]);held[b]=d}
  const x=p.axes[0]||0,y=p.axes[1]||0,dir=x<-.6?'left':x>.6?'right':y<-.6?'up':y>.6?'down':'';if(dir&&dir!=axis)go(dir);axis=dir;break}
 requestAnimationFrame(poll)})();
// A script error would otherwise leave a frozen screen with no hint: show it.
addEventListener('error',e=>{TOAST='Fehler: '+e.message+' ('+e.lineno+')';try{render()}catch(x){document.title=TOAST}});
addEventListener('unhandledrejection',e=>{TOAST='Fehler: '+(e.reason&&e.reason.message||e.reason);try{render()}catch(x){}});
function mode(){const m=location.hash.slice(1);document.body.className=m=='top'||m=='bottom'?'solo only-'+m:''}
addEventListener('hashchange',mode);mode();

function listen(){
 const es=new EventSource('api/events');
 es.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.kind=='toast')return toast(m.text);
  if(m.kind=='library')return load();
  if(m.kind=='key'){if(location.hash!='#bottom'){if(m.a=='home'){S={tab:0,sys:null,i:0};SUB='';PROMPT=null;push()}else go(m.a)}return}
  if(m.kind=='confirm'){if(m.from!=ME){if(m.open&&m.action=='desktop')confirmDesktop(true);else if(m.open&&RUN)confirmQuit(m.then?L.games.find(g=>g.id==m.then):null,true);else{CONFIRM=null;render()}}return}
  if(m.kind=='config'){CFG=m.config;return pulse()}
  if(m.kind=='settings'){if(m.from!=ME){SET=m.settings;render()}if(m.osd)osd(m.settings[m.osd]);return}
  const was=RUN;RUN=m.run;if(m.from!=ME)S={...m.ui};
  if(RUN&&(!was||was.id!=RUN.id)){ACH=null;loadAch()}if(!RUN)ACH=null;
  if(was&&!RUN)load();else render()};
}
const loadSys=scan=>LIVE&&fetch('api/system'+(scan?'?scan':'')).then(r=>r.json()).then(s=>{SYS=s;render()}).catch(()=>{});
const loadAch=()=>fetch('api/achievements').then(r=>r.json()).then(a=>{if(RUN){ACH=a;render()}}).catch(()=>{ACH={note:'Erfolge konnten nicht geladen werden.'};render()});
const load=()=>fetch('api/library').then(r=>r.json()).then(l=>{L=l;shown='';render()});
const pulse=()=>fetch('api/state').then(r=>r.json()).then(s=>{BATT=s.battery;PAIR=s.pair||null;CFG=s.config||CFG;if(!DRAG)SET=s.settings||SET;render()}).catch(()=>{});
// The Tandem service writes the library and the current state into the page (window.BOOT), so the first frame is
// already right; without the service (published preview, file opened directly) the page runs on demo data.
/*BOOT*/
if(window.BOOT){L=BOOT.library;S={...BOOT.ui};RUN=BOOT.run;BATT=BOOT.battery;SET=BOOT.settings||SET;CFG=BOOT.config||CFG;LIVE=true;if(RUN)loadAch();pulse();
 listen();setInterval(pulse,30000)}
else{L=demoLibrary();setInterval(render,30000)}
render();
</script>
