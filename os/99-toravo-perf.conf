# Toravo Tandem OS — Snapdragon 8 Gen 2 (AYN Thor) ARM64 Gaming Kernel Tuning
# Optimized for 8 GB / 12 GB / 16 GB Thor models with LZ4 ZRAM + Steam/Proton/FEX.

# Fast ZRAM paging with zero read-ahead latency penalty (page-cluster=0)
vm.swappiness = 150
vm.page-cluster = 0
vm.vfs_cache_pressure = 50

# Eliminate kcompactd background memory compaction stalls during 60/120 Hz gameplay
vm.compaction_proactiveness = 0

# Keep dirty writeback smooth to avoid SD/UFS I/O stalls during gameplay
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# High mmap limit required by modern Proton/Wine/DXVK/AAA titles
vm.max_map_count = 2147483642

# Responsive interactive scheduling + zero cross-cluster hrtimer migration IPIs
kernel.sched_autogroup_enabled = 1
kernel.timer_migration = 0

# Streaming & online gaming anti-bufferbloat (Moonlight / Chiaki / Steam Remote Play / WoW)
-net.core.default_qdisc = fq_codel
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
