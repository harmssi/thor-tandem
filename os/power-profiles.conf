# Toravo Tandem OS — Snapdragon 8 Gen 2 (AYN Thor) Silent 0-RPM & Sweet-Spot Power Config
# Loaded by armada-powerd (/etc/armada/power-profiles.conf overrides /usr/share/armada/power-profiles.conf).
# - Uses mainline EAS/PELT 'schedutil' instead of legacy polling 'conservative' / locked 'performance'.
# - Releases Adreno 740 minimum clock to 0.0 (220 MHz idle) across all profiles so menus/dialogs stay cool.
# - Enables hardware 0-RPM semi-passive fan stop (pwmfan pwm1_enable=3 cuts fan rail at PWM 0) below 52 C
#   with 3x gentler ramp_up (12) and thermal-mass smoothing (0.72) to eliminate brief loading-spike fan roar.

[general]
default_profile = balanced

[profile.eco]
label = Eco
cpu_governor = schedutil
cpu_max = 0.65
cpu_underclock = large
gpu_max = 0.70
gpu_min = 0.00
fan_curve = relaxed

[profile.balanced]
label = Balanced
cpu_governor = schedutil
cpu_max = 1.00
cpu_underclock = medium
gpu_max = 1.00
gpu_min = 0.00
fan_curve = moderate

[profile.performance]
label = Performance
cpu_governor = schedutil
cpu_max = 1.00
cpu_underclock = none
gpu_max = 1.00
gpu_min = 0.00
fan_curve = aggressive

[fan_curve.relaxed]
label = Relaxed (0 dB bis 52 C)
curve = 98:255,92:196,85:140,76:92,66:56,55:38,52:0,0:0

[fan_curve.moderate]
label = Moderate (0 dB bis 49 C)
curve = 96:255,90:204,82:148,74:98,64:62,53:42,49:0,0:0

[fan_curve.aggressive]
label = Aggressive (0 dB bis 44 C)
curve = 90:255,84:204,78:153,70:104,60:68,48:46,44:0,0:0

[fan]
min_pwm = 0
max_pwm = 255
ramp_up = 12
ramp_down = 6
smoothing = 0.72
pwm_quantum = 6
charging_pwm = 0

[suspend]
fan_safe_above = 55
fan_low_pwm = 0
fan_safe_pwm = 112
